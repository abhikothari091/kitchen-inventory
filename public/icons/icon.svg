<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#fef7ed"/>
  <g transform="translate(256,240)" fill="none" stroke="#c2410c" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- hat top -->
    <path d="M-80,20 C-80,-60 -40,-100 0,-100 C40,-100 80,-60 80,20"/>
    <circle cx="-80" cy="20" r="40" fill="#fef7ed"/>
    <circle cx="80" cy="20" r="40" fill="#fef7ed"/>
    <circle cx="0" cy="-40" r="50" fill="#fef7ed"/>
    <!-- hat band -->
    <line x1="-90" y1="50" x2="90" y2="50"/>
    <!-- hat body lines -->
    <line x1="-40" y1="50" x2="-40" y2="-10"/>
    <line x1="0" y1="50" x2="0" y2="-30"/>
    <line x1="40" y1="50" x2="40" y2="-10"/>
  </g>
</svg>
